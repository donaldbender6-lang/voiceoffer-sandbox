<!DOCTYPE html>
    <html>
        <head>
            <title>Voice Offer</title>
         <link rel="stylesheet" href="style.css">
         <meta name="viewport">
        </head>
        <body>
            <h1>Voice Offer</h1>
        <main>
            <h2>Create an Offer</h2>
        <form>
            <label for="propertyaddress">Property Address:</label>
            <input type="text" id="propertyaddress"><br>
            <label for="purchaseprice">Purchase Price:</label>
            <input type="number" id="purchaseprice"><br>
            <label for="earnestmoney">Earnest Money:</label>
            <input type="number" id="earnestmoney"><br>
            <label for="closingdate">Closing Date: </label>
            <input type="Date" id="closingdate"><br>
            <label for="sellerconcessions">Seller Concessions:</label>
            <input type="number" id="sellerconcessions"><br>
            <input type="submit" value="Submit"> 
        </form>
        </main>
        </body>
    </html>
